version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s %(levelname)s [%(name)s] %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stderr

root:
  level: INFO
  handlers: [console]

loggers:
  paper_intelligence:
    level: INFO
    propagate: true
